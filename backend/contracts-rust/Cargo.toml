[workspace]
members = [
  "contracts/governance",
  "integration-tests",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["anihdev"]

[workspace.dependencies]
ckb-std = { version = "0.16.4", default-features = false, features = ["allocator", "calc-hash", "ckb-types", "dummy-atomic", "libc", "type-id"] }
ckb-hash = { version = "0.119.0", default-features = false, features = ["ckb-contract"] }
sparse-merkle-tree = { git = "https://github.com/nervosnetwork/sparse-merkle-tree", rev = "725cd69d95e3e34cd302e83d86178e959fc53687", default-features = false, features = ["with-blake2b-ref"] }

[profile.release]
panic = "abort"
overflow-checks = true
# Workaround for recent stable rustc/LLVM regressions targeting
# `riscv64imac-unknown-none-elf` with `-C target-feature=-a`.
# Keep release optimizations but avoid full LTO to preserve build stability.
lto = false
codegen-units = 1
strip = true
