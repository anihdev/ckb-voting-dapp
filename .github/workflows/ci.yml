name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.81.0
          target: riscv64imac-unknown-none-elf
          components: rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/contracts-rust/Cargo.toml --all --check

      - name: Check Rust contract
        run: pnpm check:contract:rust

      - name: Build Rust contract
        run: pnpm build:contract:rust

      - name: Run CKB-VM integration tests
        run: cargo test --manifest-path backend/contracts-rust/Cargo.toml -p integration-tests

      - name: Run frontend tests
        run: pnpm test:frontend

      - name: Build frontend
        run: pnpm build:frontend

      - name: Check deploy TypeScript
        run: pnpm --filter ckb-voting-deploy exec tsc -p tsconfig.json --noEmit

      - name: Check committed patch whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Report production dependency advisories
        continue-on-error: true
        run: pnpm audit --prod
